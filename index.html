<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Shopify Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Standardizing system fonts to match Shopify's native feel */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'San Francisco', 'Segoe UI', Roboto, Helvetica, sans-serif;
            background-color: #f4f6f8; /* Shopify Admin Background */
            color: #202223; /* Polaris Text Color */
        }

        /* Subtle scrollbars */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #babec3; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #8c9196; }

        /* Shopify Card Shadow */
        .polaris-card {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 0 0 1px rgba(63, 63, 68, 0.05), 0 1px 3px 0 rgba(63, 63, 68, 0.15);
        }

        /* Shopify Inputs */
        .polaris-input {
            border: 1px solid #c9cccf;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.05);
            border-radius: 4px;
        }
        .polaris-input:focus {
            outline: none;
            border-color: #008060;
            box-shadow: 0 0 0 2px rgba(0, 128, 96, 0.2);
        }
    </style>
</head>
<body class="flex min-h-screen antialiased selection:bg-[#bae0ff] selection:text-[#005499]">

    <!-- MAIN DASHBOARD CONTENT -->
    <main class="flex-1 p-4 md:p-8 max-w-7xl mx-auto w-full">
        
        <!-- TOP NAVIGATION & ACTIONS -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
            <div>
                <h1 class="text-[20px] font-bold text-[#202223]">Dashboard</h1>
            </div>
            
            <!-- Secondary Actions -->
            <div class="flex items-center gap-2">
                <button onclick="exportBackup()" class="bg-white hover:bg-[#f6f6f7] text-[#202223] text-[13px] font-medium px-3 py-1.5 rounded border border-[#c9cccf] shadow-[0_1px_2px_rgba(0,0,0,0.05)] transition-colors flex items-center gap-2">
                    <i class="fa-solid fa-download text-[#6d7175]"></i> Export
                </button>
                
                <div class="relative group">
                    <input type="file" id="importFile" accept=".json" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" onchange="importBackup(event)">
                    <button class="bg-white hover:bg-[#f6f6f7] text-[#202223] text-[13px] font-medium px-3 py-1.5 rounded border border-[#c9cccf] shadow-[0_1px_2px_rgba(0,0,0,0.05)] transition-colors flex items-center gap-2">
                        <i class="fa-solid fa-upload text-[#6d7175]"></i> Import
                    </button>
                </div>

                <button onclick="factoryReset()" class="bg-white hover:bg-[#fff4f4] text-[#d82c0d] text-[13px] font-medium px-3 py-1.5 rounded border border-[#c9cccf] shadow-[0_1px_2px_rgba(0,0,0,0.05)] transition-colors">
                    Reset
                </button>

                <button onclick="openOrderModal()" class="ml-2 bg-[#008060] hover:bg-[#006e52] text-white text-[13px] font-medium px-4 py-1.5 rounded shadow-[inset_0_1px_0_rgba(255,255,255,0.2),0_1px_2px_rgba(0,0,0,0.05)] transition-colors flex items-center gap-2">
                    Create order
                </button>
            </div>
        </header>

        <!-- KPI PERFORMANCE GRID -->
        <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
            <div class="polaris-card p-4">
                <div class="flex items-center gap-2 mb-2">
                    <p class="text-[13px] font-medium text-[#6d7175]">Total sales</p>
                    <i class="fa-solid fa-circle-info text-[#babec3] text-[10px]"></i>
                </div>
                <h3 class="text-2xl font-semibold text-[#202223]" id="kpi-revenue">$0.00</h3>
            </div>
            <div class="polaris-card p-4">
                <p class="text-[13px] font-medium text-[#6d7175] mb-2">Total orders</p>
                <h3 class="text-2xl font-semibold text-[#202223]" id="kpi-orders">0</h3>
            </div>
            <div class="polaris-card p-4">
                <p class="text-[13px] font-medium text-[#6d7175] mb-2">Items sold</p>
                <h3 class="text-2xl font-semibold text-[#202223]" id="kpi-sold">0</h3>
            </div>
            <div class="polaris-card p-4">
                <p class="text-[13px] font-medium text-[#6d7175] mb-2">Average order value</p>
                <h3 class="text-2xl font-semibold text-[#202223]" id="kpi-aov">$0.00</h3>
            </div>
        </section>

        <!-- DATA VISUALIZATION SECTION -->
        <section class="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-6">
            <div class="polaris-card p-5 lg:col-span-2 flex flex-col">
                <h4 class="text-[14px] font-semibold text-[#202223] mb-4">Sales over time</h4>
                <div class="flex-1 min-h-[250px]"><canvas id="revenueChart"></canvas></div>
            </div>

            <div class="polaris-card p-5 flex flex-col">
                <h4 class="text-[14px] font-semibold text-[#202223] mb-4">Sales by location</h4>
                <div class="flex-1 min-h-[250px] flex justify-center items-center"><canvas id="shippingChart"></canvas></div>
            </div>
        </section>

        <!-- INVENTORY SECTION -->
        <section class="polaris-card overflow-hidden mb-6">
            <div class="px-5 py-4 border-b border-[#e1e3e5]">
                <h4 class="text-[14px] font-semibold text-[#202223]">Inventory</h4>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-[#f4f6f8] border-b border-[#e1e3e5] text-[#202223] text-[12px] font-semibold">
                            <th class="px-5 py-2.5 w-1/4">SKU</th>
                            <th class="px-5 py-2.5">Product</th>
                            <th class="px-5 py-2.5">Price</th>
                            <th class="px-5 py-2.5">Available</th>
                            <th class="px-5 py-2.5">Status</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryTableBody" class="divide-y divide-[#e1e3e5] text-[13px] text-[#202223]">
                        <!-- Dynamically filled -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- RECENT ORDERS SECTION -->
        <section class="polaris-card overflow-hidden">
            <div class="px-5 py-4 border-b border-[#e1e3e5] flex justify-between items-center">
                <h4 class="text-[14px] font-semibold text-[#202223]">Recent orders</h4>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse whitespace-nowrap">
                    <thead>
                        <tr class="bg-[#f4f6f8] border-b border-[#e1e3e5] text-[#202223] text-[12px] font-semibold">
                            <th class="px-5 py-2.5">Order</th>
                            <th class="px-5 py-2.5">Date</th>
                            <th class="px-5 py-2.5">Customer</th>
                            <th class="px-5 py-2.5">Fulfillment status</th>
                            <th class="px-5 py-2.5">Total</th>
                            <th class="px-5 py-2.5 text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody" class="divide-y divide-[#e1e3e5] text-[13px] text-[#202223]">
                        <!-- Dynamically filled -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- CREATE ORDER MODAL -->
    <div id="addOrderModal" class="fixed inset-0 bg-[#202223]/50 backdrop-blur-[1px] hidden flex justify-center items-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-xl flex flex-col max-h-[90vh]">
            <div class="px-5 py-4 border-b border-[#e1e3e5] flex justify-between items-center">
                <h2 class="text-[16px] font-semibold text-[#202223]">Create order</h2>
                <button onclick="closeModal('addOrderModal')" class="text-[#6d7175] hover:text-[#202223] transition-colors">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <form id="orderForm" onsubmit="addOrder(event)" class="overflow-y-auto p-5">
                
                <div class="mb-6">
                    <h3 class="text-[13px] font-semibold text-[#202223] mb-3">Customer</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-[13px] text-[#202223] mb-1">First and last name</label>
                            <input type="text" id="clientName" required class="polaris-input w-full px-3 py-2 text-[13px]">
                        </div>
                        <div>
                            <label class="block text-[13px] text-[#202223] mb-1">Email or phone</label>
                            <input type="text" id="clientContact" class="polaris-input w-full px-3 py-2 text-[13px]">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-[13px] text-[#202223] mb-1">Shipping address (City, Country)</label>
                            <input type="text" id="clientDest" required placeholder="e.g. Paris, France" class="polaris-input w-full px-3 py-2 text-[13px]">
                        </div>
                    </div>
                </div>

                <hr class="border-[#e1e3e5] mb-6">

                <div>
                    <h3 class="text-[13px] font-semibold text-[#202223] mb-3">Products</h3>
                    <div class="grid grid-cols-1 gap-4">
                        <div>
                            <label class="block text-[13px] text-[#202223] mb-1">Search products</label>
                            <select id="productSelect" required onchange="updateFormPrice()" class="polaris-input w-full px-3 py-2 text-[13px] bg-white cursor-pointer">
                                <!-- Loaded dynamically -->
                            </select>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-[13px] text-[#202223] mb-1">Price ($)</label>
                                <input type="number" id="amountInput" step="0.01" required class="polaris-input w-full px-3 py-2 text-[13px]">
                            </div>
                            <div>
                                <label class="block text-[13px] text-[#202223] mb-1">Status</label>
                                <select id="statusInput" class="polaris-input w-full px-3 py-2 text-[13px] bg-white cursor-pointer">
                                    <option value="Unfulfilled">Unfulfilled</option>
                                    <option value="Fulfilled">Fulfilled</option>
                                    <option value="Partially fulfilled">Partially fulfilled</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mt-8 flex gap-3 justify-end border-t border-[#e1e3e5] pt-4 -mx-5 px-5">
                    <button type="button" onclick="closeModal('addOrderModal')" class="bg-white hover:bg-[#f6f6f7] text-[#202223] text-[13px] font-medium px-4 py-1.5 rounded border border-[#c9cccf] shadow-[0_1px_2px_rgba(0,0,0,0.05)] transition-colors">Cancel</button>
                    <button type="submit" class="bg-[#008060] hover:bg-[#006e52] text-white text-[13px] font-medium px-4 py-1.5 rounded shadow-[inset_0_1px_0_rgba(255,255,255,0.2),0_1px_2px_rgba(0,0,0,0.05)] transition-colors">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ENGINE JAVASCRIPT -->
    <script>
        const defaultData = {
            revenue: 0,
            ordersCount: 0,
            watchesSold: 0,
            chartData: [0, 0, 0, 0, 0, 0], 
            locations: {}, 
            orders: [],
            inventory: [
                { id: 'SKU-OB-01', name: 'Obsidian Chronograph', stock: 25, price: 349.00 },
                { id: 'SKU-VG-02', name: 'Vanguard Emerald Edition', stock: 12, price: 420.00 },
                { id: 'SKU-SN-03', name: 'Stealth Noir Minimalist', stock: 40, price: 195.00 },
                { id: 'SKU-AQ-04', name: 'Aqua-Dive Pro Automatic', stock: 8, price: 650.00 },
                { id: 'SKU-CL-05', name: 'Classic Leather Heritage', stock: 18, price: 280.00 }
            ]
        };

        let appData = JSON.parse(localStorage.getItem('shopifyCloneData')) || defaultData;
        let revChartInstance = null;
        let shipChartInstance = null;

        function renderDashboard() {
            const aov = appData.ordersCount > 0 ? (appData.revenue / appData.ordersCount).toFixed(2) : "0.00";

            // KPI Sync
            document.getElementById('kpi-revenue').innerText = '$' + appData.revenue.toLocaleString(undefined, {minimumFractionDigits: 2});
            document.getElementById('kpi-orders').innerText = appData.ordersCount.toLocaleString();
            document.getElementById('kpi-sold').innerText = appData.watchesSold.toLocaleString();
            document.getElementById('kpi-aov').innerText = '$' + aov;

            // Inventory Table
            const invTable = document.getElementById('inventoryTableBody');
            invTable.innerHTML = '';
            appData.inventory.forEach(item => {
                // Shopify Status Badges
                let stockStatus = item.stock > 10 ? '<span class="bg-[#aee9d1] text-[#006e52] px-2.5 py-0.5 rounded-xl text-[12px] font-medium">Active</span>' : 
                                  item.stock > 0 ? '<span class="bg-[#ffea8a] text-[#8a6116] px-2.5 py-0.5 rounded-xl text-[12px] font-medium">Low stock</span>' : 
                                  '<span class="bg-[#fed3d1] text-[#8c2626] px-2.5 py-0.5 rounded-xl text-[12px] font-medium">Out of stock</span>';
                
                invTable.innerHTML += `
                    <tr class="hover:bg-[#f8f9fa] transition-colors cursor-default">
                        <td class="px-5 py-3 text-[#6d7175] font-mono text-[12px]">${item.id}</td>
                        <td class="px-5 py-3 font-medium text-[#202223] hover:underline cursor-pointer">${item.name}</td>
                        <td class="px-5 py-3">$${item.price.toFixed(2)}</td>
                        <td class="px-5 py-3 ${item.stock <= 5 ? 'text-[#d82c0d] font-semibold' : ''}">${item.stock}</td>
                        <td class="px-5 py-3">${stockStatus}</td>
                    </tr>
                `;
            });

            // Orders Table
            const orderTable = document.getElementById('ordersTableBody');
            orderTable.innerHTML = '';
            if (appData.orders.length === 0) {
                orderTable.innerHTML = `<tr><td colspan="6" class="px-5 py-8 text-center text-[#6d7175]">No orders found</td></tr>`;
            } else {
                appData.orders.forEach((order, index) => {
                    let statusBadge = order.status === 'Fulfilled' ? '<span class="bg-[#e3f1df] text-[#2c6e2f] px-2.5 py-0.5 rounded-xl text-[12px] font-medium">Fulfilled</span>' : 
                                      order.status === 'Partially fulfilled' ? '<span class="bg-[#ffea8a] text-[#8a6116] px-2.5 py-0.5 rounded-xl text-[12px] font-medium">Partially fulfilled</span>' : 
                                      '<span class="bg-[#e4e5e7] text-[#42474c] px-2.5 py-0.5 rounded-xl text-[12px] font-medium">Unfulfilled</span>';

                    orderTable.innerHTML += `
                        <tr class="hover:bg-[#f8f9fa] transition-colors">
                            <td class="px-5 py-3 font-semibold text-[#202223] hover:underline cursor-pointer">#${order.id}</td>
                            <td class="px-5 py-3 text-[#6d7175]">${order.date || 'Today'}</td>
                            <td class="px-5 py-3">${order.clientName}</td>
                            <td class="px-5 py-3">${statusBadge}</td>
                            <td class="px-5 py-3 font-medium">$${order.amount.toFixed(2)}</td>
                            <td class="px-5 py-3 text-center">
                                <button onclick="deleteOrder(${index})" class="text-[#6d7175] hover:text-[#d82c0d] p-1 transition-colors" title="Delete order">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                });
            }

            renderCharts();
            localStorage.setItem('shopifyCloneData', JSON.stringify(appData));
        }

        function openOrderModal() {
            const select = document.getElementById('productSelect');
            select.innerHTML = '<option value="" disabled selected>Browse products...</option>';
            appData.inventory.forEach(item => {
                if (item.stock > 0) {
                    select.innerHTML += `<option value="${item.id}">${item.name} - $${item.price}</option>`;
                }
            });
            document.getElementById('addOrderModal').classList.remove('hidden');
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
            document.getElementById('orderForm').reset();
        }

        function updateFormPrice() {
            const selectedId = document.getElementById('productSelect').value;
            const product = appData.inventory.find(i => i.id === selectedId);
            if(product) document.getElementById('amountInput').value = product.price;
        }

        function addOrder(e) {
            e.preventDefault();
            const skuId = document.getElementById('productSelect').value;
            const productObj = appData.inventory.find(i => i.id === skuId);
            
            if(!productObj) return alert("Please select a valid product.");

            const amount = parseFloat(document.getElementById('amountInput').value);
            const clientName = document.getElementById('clientName').value;
            const clientContact = document.getElementById('clientContact').value;
            const dest = document.getElementById('clientDest').value;
            const status = document.getElementById('statusInput').value;
            const newId = Math.floor(1000 + Math.random() * 9000);
            
            // Generate standard date format
            const dateObj = new Date();
            const dateStr = dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

            appData.orders.unshift({ id: newId, date: dateStr, product: productObj.name, skuId, clientName, clientContact, dest, status, amount });
            appData.revenue += amount;
            appData.ordersCount += 1;
            appData.watchesSold += 1;
            productObj.stock -= 1; 
            
            let country = dest.split(',').pop().trim();
            if(!country) country = "Other";
            appData.locations[country] = (appData.locations[country] || 0) + 1;

            appData.chartData[appData.chartData.length - 1] += amount;

            closeModal('addOrderModal');
            renderDashboard();
        }

        function deleteOrder(index) {
            if(confirm('Are you sure you want to delete this order? This action cannot be undone.')) {
                const order = appData.orders[index];
                
                appData.revenue -= order.amount;
                appData.ordersCount -= 1;
                appData.watchesSold -= 1;
                
                const productObj = appData.inventory.find(i => i.id === order.skuId);
                if(productObj) productObj.stock += 1;

                let country = order.dest.split(',').pop().trim() || "Other";
                if(appData.locations[country]) {
                    appData.locations[country] -= 1;
                    if(appData.locations[country] <= 0) delete appData.locations[country];
                }

                appData.chartData[appData.chartData.length - 1] = Math.max(0, appData.chartData[appData.chartData.length - 1] - order.amount);
                appData.orders.splice(index, 1);
                renderDashboard();
            }
        }

        function exportBackup() {
            const dataStr = JSON.stringify(appData, null, 4);
            const blob = new Blob([dataStr], { type: "application/json" });
            const blobUrl = URL.createObjectURL(blob);
            
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", blobUrl);
            downloadAnchorNode.setAttribute("download", "shopify_export_" + new Date().toISOString().split('T')[0] + ".json");
            document.body.appendChild(downloadAnchorNode);
            
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
            URL.revokeObjectURL(blobUrl);
        }

        function importBackup(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if(importedData && importedData.inventory && importedData.orders) {
                        appData = importedData;
                        renderDashboard();
                    } else { 
                        alert('Invalid Shopify export file.'); 
                    }
                } catch (err) { 
                    alert('Error reading file.'); 
                }
            };
            reader.readAsText(file);
        }

        function factoryReset() {
            if(confirm('Clear all data and reset to default?')) {
                appData = JSON.parse(JSON.stringify(defaultData)); 
                renderDashboard();
            }
        }

        // CHARTS CONFIGURATION
        Chart.defaults.color = '#6d7175'; 
        Chart.defaults.font.family = 'Inter';
        Chart.defaults.font.size = 12;

        function renderCharts() {
            if(revChartInstance) revChartInstance.destroy();
            if(shipChartInstance) shipChartInstance.destroy();

            // Shopify Bar/Line hybrid style
            revChartInstance = new Chart(document.getElementById('revenueChart').getContext('2d'), {
                type: 'line',
                data: {
                    labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
                    datasets: [{ 
                        label: 'Sales',
                        data: appData.chartData, 
                        borderColor: '#008060', 
                        backgroundColor: 'rgba(0, 128, 96, 0.05)', 
                        borderWidth: 2, 
                        fill: true, 
                        tension: 0.1,
                        pointBackgroundColor: '#008060',
                        pointBorderColor: '#ffffff',
                        pointBorderWidth: 2,
                        pointRadius: 4,
                    }]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false, 
                    plugins: { legend: { display: false } }, 
                    scales: { 
                        y: { grid: { color: '#f4f6f8', drawBorder: false }, beginAtZero: true, border: {display: false} }, 
                        x: { grid: { display: false }, border: {display: false} } 
                    } 
                }
            });

            // Doughnut Locations Chart
            const locKeys = Object.keys(appData.locations);
            const locValues = Object.values(appData.locations);
            
            const chartLabels = locKeys.length > 0 ? locKeys : ['No data'];
            const chartData = locValues.length > 0 ? locValues : [1];
            // Soft Shopify-esque reporting colors
            const chartColors = locValues.length > 0 ? ['#5c6ac4', '#47c1bf', '#008060', '#f49342', '#ba79c4'] : ['#e1e3e5'];

            shipChartInstance = new Chart(document.getElementById('shippingChart').getContext('2d'), {
                type: 'doughnut',
                data: {
                    labels: chartLabels,
                    datasets: [{ data: chartData, backgroundColor: chartColors, borderWidth: 2, borderColor: '#ffffff' }]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false, 
                    cutout: '70%',
                    plugins: { 
                        legend: { position: 'bottom', labels: { usePointStyle: true, boxWidth: 8 } },
                        tooltip: { enabled: locKeys.length > 0 }
                    } 
                }
            });
        }

        window.onload = renderDashboard;
    </script>
</body>
</html>

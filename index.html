<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Dashboard - Pro | Secure</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif;
            color: #202223; 
            margin: 0;
            overflow-x: hidden;
        }

        /* --- DYNAMIC BLURRED BACKGROUND --- */
        .bg-mesh {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #f4f6f8;
            z-index: -1;
            overflow: hidden;
            transition: all 0.5s ease;
        }
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            animation: float 20s infinite ease-in-out alternate;
        }
        .blob-1 { background: #34d399; width: 50vw; height: 50vw; top: -10%; left: -10%; animation-delay: 0s; }
        .blob-2 { background: #60a5fa; width: 40vw; height: 40vw; bottom: 0; right: -10%; animation-delay: -5s; }
        .blob-3 { background: #a78bfa; width: 45vw; height: 45vw; top: 40%; left: 30%; animation-delay: -10s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 50px) scale(1.1); }
        }

        /* --- GLASSMORPHISM CARDS --- */
        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .glass-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        /* --- INPUTS --- */
        .polaris-input {
            border: 1px solid rgba(201, 204, 207, 0.8);
            background: rgba(255, 255, 255, 0.9);
            border-radius: 6px;
            transition: all 0.3s ease;
        }
        .polaris-input:focus {
            outline: none;
            border-color: #008060;
            box-shadow: 0 0 0 3px rgba(0, 128, 96, 0.2);
            background: #ffffff;
        }

        /* Seamless Inputs for Tables */
        .seamless-input {
            border: 1px solid transparent;
            background: transparent;
            transition: all 0.2s ease;
            border-radius: 4px;
        }
        .seamless-input:hover {
            border-color: rgba(201, 204, 207, 0.5);
            background: rgba(255, 255, 255, 0.5);
        }
        .seamless-input:focus {
            outline: none;
            border-color: #008060;
            background: #ffffff;
            box-shadow: 0 0 0 2px rgba(0, 128, 96, 0.1);
        }

        /* --- SMOOTH ENTRANCE ANIMATIONS --- */
        @keyframes fadeSlideUp {
            0% { opacity: 0; transform: translateY(30px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-fade-in {
            opacity: 0; 
            animation: fadeSlideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        .delay-400 { animation-delay: 400ms; }
        .delay-500 { animation-delay: 500ms; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(8px); }
            75% { transform: translateX(-8px); }
        }
        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }

        /* --- BLUR SECURITY STATE --- */
        .locked-blur {
            filter: blur(16px) grayscale(30%);
            pointer-events: none;
            user-select: none;
            opacity: 0.3;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #authOverlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(244, 246, 248, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.6s ease;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(186, 190, 195, 0.8); border-radius: 10px; }
    </style>
</head>

                </button>
            </form>

            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>
            <div class="blob blob-3"></div>
        </div>

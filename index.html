<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Dashboard | Sales & Revenue</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        /* Hide scrollbar for cleaner look */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 flex min-h-screen">

    <main class="flex-1 p-6 md:p-10 overflow-y-auto">
        
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold text-white">Sales & Revenue Overview</h1>
                <p class="text-slate-400 text-sm mt-1 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    Live & Auto-Saving to Local Device
                </p>
            </div>
            
            <div class="flex items-center gap-3 bg-slate-950 p-2 rounded-xl border border-slate-800">
                <button onclick="exportBackup()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-medium px-4 py-2 rounded-lg transition flex items-center gap-2">
                    <i class="fa-solid fa-download"></i> Backup Data
                </button>
                <div class="relative">
                    <input type="file" id="importFile" accept=".json" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" onchange="importBackup(event)">
                    <button class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium px-4 py-2 rounded-lg transition border border-slate-700 flex items-center gap-2">
                        <i class="fa-solid fa-upload"></i> Restore
                    </button>
                </div>
                <button onclick="factoryReset()" class="bg-rose-500/10 hover:bg-rose-500/20 text-rose-500 text-xs font-medium px-4 py-2 rounded-lg transition border border-rose-500/20">
                    Reset
                </button>
            </div>
        </header>

        <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
            <div class="bg-slate-950 p-6 rounded-2xl border border-slate-800">
                <p class="text-sm font-medium text-slate-400 uppercase tracking-wider">Total Revenue</p>
                <h3 class="text-3xl font-bold text-white mt-2" id="kpi-revenue">$0.00</h3>
            </div>
            <div class="bg-slate-950 p-6 rounded-2xl border border-slate-800">
                <p class="text-sm font-medium text-slate-400 uppercase tracking-wider">Total Orders</p>
                <h3 class="text-3xl font-bold text-white mt-2" id="kpi-orders">0</h3>
            </div>
            <div class="bg-slate-950 p-6 rounded-2xl border border-slate-800">
                <p class="text-sm font-medium text-slate-400 uppercase tracking-wider">Watches Sold</p>
                <h3 class="text-3xl font-bold text-white mt-2" id="kpi-sold">0</h3>
            </div>
            <div class="bg-slate-950 p-6 rounded-2xl border border-slate-800">
                <p class="text-sm font-medium text-slate-400 uppercase tracking-wider">Avg. Order Value</p>
                <h3 class="text-3xl font-bold text-white mt-2" id="kpi-aov">$0.00</h3>
            </div>
        </section>

        <section class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
            <div class="bg-slate-950 p-6 rounded-2xl border border-slate-800 lg:col-span-2">
                <h4 class="text-base font-semibold text-white mb-4">Revenue Trend</h4>
                <div class="h-64"><canvas id="revenueChart"></canvas></div>
            </div>
            <div class="bg-slate-950 p-6 rounded-2xl border border-slate-800">
                <h4 class="text-base font-semibold text-white mb-4">Top Locations</h4>
                <div class="h-64 flex justify-center items-center"><canvas id="shippingChart"></canvas></div>
            </div>
        </section>

        <section class="bg-slate-950 rounded-2xl border border-slate-800 overflow-hidden">
            <div class="p-6 border-b border-slate-800 flex flex-col sm:flex-row justify-between items-center gap-4">
                <h4 class="text-base font-semibold text-white">Recent Transactions</h4>
                <button onclick="toggleModal('addOrderModal')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-medium px-4 py-2 rounded-xl transition flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> Add New Order
                </button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-900/50 border-b border-slate-800 text-slate-400 text-xs font-semibold uppercase tracking-wider">
                            <th class="p-4">Order ID</th>
                            <th class="p-4">Product Name</th>
                            <th class="p-4">Destination</th>
                            <th class="p-4">Status</th>
                            <th class="p-4 text-right">Amount</th>
                            <th class="p-4 text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody" class="divide-y divide-slate-800/60 text-sm text-slate-300">
                        </tbody>
                </table>
            </div>
        </section>
    </main>

    <div id="addOrderModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex justify-center items-center z-50">
        <div class="bg-slate-900 border border-slate-700 p-8 rounded-2xl w-full max-w-md shadow-2xl">
            <h2 class="text-xl font-bold text-white mb-6">Record New Sale</h2>
            <form id="orderForm" onsubmit="addOrder(event)">
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Product Name</label>
                        <input type="text" id="productInput" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-indigo-500">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Amount ($)</label>
                            <input type="number" id="amountInput" step="0.01" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Destination</label>
                            <input type="text" id="destInput" required placeholder="e.g. USA" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-indigo-500">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Status</label>
                        <select id="statusInput" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-indigo-500">
                            <option value="Delivered">Delivered</option>
                            <option value="In Transit">In Transit</option>
                            <option value="Processing">Processing</option>
                        </select>
                    </div>
                </div>
                <div class="mt-8 flex gap-3 justify-end">
                    <button type="button" onclick="toggleModal('addOrderModal')" class="px-4 py-2 text-sm text-slate-400 hover:text-white transition">Cancel</button>
                    <button type="submit" class="px-6 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg transition">Save Order</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 1. Initial/Default Data Structure
        const defaultData = {
            revenue: 48250,
            ordersCount: 1248,
            watchesSold: 312,
            chartData: [8200, 12400, 11100, 18500, 22400, 28250], // Jan - Jun
            locations: { 'USA': 45, 'UK': 20, 'Japan': 15, 'Germany': 12, 'Canada': 8 },
            orders: [
                { id: 'ORD-9482', product: 'Midnight Chronograph', dest: 'New York, USA', status: 'Delivered', amount: 249.00 },
                { id: 'ORD-9481', product: 'Rose Gold Minimalist', dest: 'London, UK', status: 'In Transit', amount: 189.00 }
            ]
        };

        // 2. Load Data from Local Storage (Auto-Save system)
        let appData = JSON.parse(localStorage.getItem('hqDashboardData')) || defaultData;
        let revChartInstance = null;
        let shipChartInstance = null;

        // 3. Main Render Function (Updates HTML based on data)
        function renderDashboard() {
            // Calculate AOV dynamically
            const aov = appData.ordersCount > 0 ? (appData.revenue / appData.ordersCount).toFixed(2) : "0.00";

            // Update KPIs
            document.getElementById('kpi-revenue').innerText = '$' + appData.revenue.toLocaleString(undefined, {minimumFractionDigits: 2});
            document.getElementById('kpi-orders').innerText = appData.ordersCount.toLocaleString();
            document.getElementById('kpi-sold').innerText = appData.watchesSold.toLocaleString();
            document.getElementById('kpi-kpi-aov', aov);
            document.getElementById('kpi-aov').innerText = '$' + aov;

            // Update Table
            const tableBody = document.getElementById('ordersTableBody');
            tableBody.innerHTML = '';
            appData.orders.forEach((order, index) => {
                let statusColor = order.status === 'Delivered' ? 'text-emerald-400 bg-emerald-500/10 border-emerald-500/20' : 
                                  order.status === 'In Transit' ? 'text-amber-400 bg-amber-500/10 border-amber-500/20' : 
                                  'text-indigo-400 bg-indigo-500/10 border-indigo-500/20';

                tableBody.innerHTML += `
                    <tr class="hover:bg-slate-900/40 transition">
                        <td class="p-4 font-mono text-xs text-indigo-400">#${order.id}</td>
                        <td class="p-4 font-medium text-white">${order.product}</td>
                        <td class="p-4">${order.dest}</td>
                        <td class="p-4"><span class="px-2.5 py-1 text-xs font-medium rounded-full border ${statusColor}">${order.status}</span></td>
                        <td class="p-4 text-right font-semibold text-white">$${order.amount.toFixed(2)}</td>
                        <td class="p-4 text-center">
                            <button onclick="deleteOrder(${index})" class="text-slate-500 hover:text-rose-500 transition"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });

            // Update Charts
            renderCharts();
            
            // AUTO-SAVE to browser
            localStorage.setItem('hqDashboardData', JSON.stringify(appData));
        }

        // 4. Add New Order Logic
        function addOrder(e) {
            e.preventDefault();
            const product = document.getElementById('productInput').value;
            const amount = parseFloat(document.getElementById('amountInput').value);
            const dest = document.getElementById('destInput').value;
            const status = document.getElementById('statusInput').value;
            
            const newId = 'ORD-' + Math.floor(1000 + Math.random() * 9000);

            // Update global data state
            appData.orders.unshift({ id: newId, product, dest, status, amount });
            appData.revenue += amount;
            appData.ordersCount += 1;
            appData.watchesSold += 1;
            
            // Add a slight bump to the latest chart month to simulate real-time graph movement
            appData.chartData[appData.chartData.length - 1] += amount;

            // Save and re-render
            toggleModal('addOrderModal');
            document.getElementById('orderForm').reset();
            renderDashboard();
        }

        // 5. Delete Order
        function deleteOrder(index) {
            if(confirm('Delete this record?')) {
                const order = appData.orders[index];
                appData.revenue -= order.amount;
                appData.ordersCount -= 1;
                appData.watchesSold -= 1;
                appData.orders.splice(index, 1);
                renderDashboard();
            }
        }

        // 6. BACKUP: Export Data to JSON File
        function exportBackup() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "dashboard_backup_" + new Date().toISOString().split('T')[0] + ".json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }

        // 7. RESTORE: Import Data from JSON File
        function importBackup(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if(importedData && importedData.revenue !== undefined) {
                        appData = importedData;
                        renderDashboard();
                        alert('Backup Restored Successfully!');
                    } else { alert('Invalid backup file format.'); }
                } catch (err) { alert('Error reading file.'); }
            };
            reader.readAsText(file);
        }

        function factoryReset() {
            if(confirm('WARNING: This will wipe all current data and restore defaults. Are you sure?')) {
                appData = JSON.parse(JSON.stringify(defaultData)); // Deep copy default
                renderDashboard();
            }
        }

        // Utility: Modal Toggle
        function toggleModal(id) {
            const modal = document.getElementById(id);
            modal.classList.toggle('hidden');
        }

        // Chart Initialization
        Chart.defaults.color = '#94a3b8';
        Chart.defaults.borderColor = '#334155';

        function renderCharts() {
            if(revChartInstance) revChartInstance.destroy();
            if(shipChartInstance) shipChartInstance.destroy();

            revChartInstance = new Chart(document.getElementById('revenueChart').getContext('2d'), {
                type: 'line',
                data: {
                    labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
                    datasets: [{ label: 'Gross Sales ($)', data: appData.chartData, borderColor: '#6366f1', backgroundColor: 'rgba(99, 102, 241, 0.1)', borderWidth: 3, fill: true, tension: 0.3 }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { grid: { color: '#1e293b' } }, x: { grid: { display: false } } } }
            });

            shipChartInstance = new Chart(document.getElementById('shippingChart').getContext('2d'), {
                type: 'doughnut',
                data: {
                    labels: Object.keys(appData.locations),
                    datasets: [{ data: Object.values(appData.locations), backgroundColor: ['#6366f1', '#10b981', '#f59e0b', '#f43f5e', '#06b6d4'], borderWidth: 0 }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { padding: 15, boxWidth: 12 } } } }
            });
        }

        // Boot up
        window.onload = renderDashboard;
    </script>
</body>
</html>
